[project]
name = "viafencer"
version = "0.1.0"
description = "KiCad 10 IPC tool for creating RF via fences around selected tracks and arcs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kicad-python>=0.7.1",
]

[project.scripts]
viafencer = "viafencer.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viafencer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
